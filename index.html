<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Senda del Inmortal 3D · Cultivo Xianxia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Alegreya+Sans:wght@400;500;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --ink:#0b0912; --panel:#161126; --panel2:#1d1631;
  --gold:#e8b64c; --gold-soft:#f4d78a; --jade:#57c99b; --jade-soft:#9fe8cb;
  --violet:#a06ee8; --violet-soft:#d3b6f5; --red:#e06060;
  --text:#ece4d2; --dim:#a49a86; --line:rgba(232,182,76,.26);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Alegreya Sans',Georgia,serif;color:var(--text);background:var(--ink);min-height:100vh;overflow-x:hidden;
  background-image:radial-gradient(ellipse 60% 40% at 85% -5%,rgba(160,110,232,.14),transparent),
  radial-gradient(ellipse 50% 35% at 10% 108%,rgba(87,201,155,.10),transparent);}
::selection{background:rgba(232,182,76,.35)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-track{background:#0d0a16}
::-webkit-scrollbar-thumb{background:#3a2f55;border:2px solid #0d0a16;border-radius:6px}
#app{max-width:1500px;margin:0 auto;padding:12px 14px 30px}
header#top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:6px 4px 14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.brand .glyph{font-family:'Ma Shan Zheng',serif;font-size:54px;line-height:1;color:var(--gold);animation:breath 4.5s ease-in-out infinite}
@keyframes breath{0%,100%{text-shadow:0 0 14px rgba(232,182,76,.4)}50%{text-shadow:0 0 26px rgba(232,182,76,.8),0 0 60px rgba(160,110,232,.35)}}
.brand h1{font-family:'Cinzel',serif;font-size:25px;letter-spacing:.14em;color:var(--gold-soft);font-weight:700}
.brand p{color:var(--dim);font-style:italic;font-size:13.5px;letter-spacing:.06em}
.head-right{display:flex;align-items:center;gap:10px}
#save-ind{font-size:12px;color:var(--jade);opacity:0;transition:opacity .4s}
#save-ind.show{opacity:1}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr) 330px;gap:14px;align-items:start}
@media(max-width:1180px){.layout{grid-template-columns:280px minmax(0,1fr)}#col-right{grid-column:1/-1}}
@media(max-width:860px){.layout{grid-template-columns:1fr}}
.panel{position:relative;background:linear-gradient(165deg,var(--panel) 0%,#100c1d 80%);border:1px solid var(--line);padding:14px;margin-bottom:14px;border-radius:3px;box-shadow:0 4px 22px rgba(0,0,0,.45)}
.panel::before,.panel::after{content:'';position:absolute;width:16px;height:16px;pointer-events:none;opacity:.8}
.panel::before{top:4px;left:4px;border-top:1px solid var(--gold);border-left:1px solid var(--gold)}
.panel::after{bottom:4px;right:4px;border-bottom:1px solid var(--gold);border-right:1px solid var(--gold)}
.panel h2{font-family:'Cinzel',serif;font-size:14px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.panel h2 .zg,.panel h3 .zg{font-family:'Ma Shan Zheng',serif;font-size:20px;color:var(--violet-soft);letter-spacing:0}
.panel h3{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.14em;color:var(--jade-soft);margin:12px 0 6px;text-transform:uppercase}
.btn{font-family:'Cinzel',serif;font-size:12.5px;letter-spacing:.06em;color:var(--gold-soft);background:linear-gradient(180deg,#251b3f,#171128);border:1px solid rgba(232,182,76,.42);padding:8px 12px;cursor:pointer;border-radius:2px;transition:all .18s ease}
.btn:hover:not(:disabled){transform:translateY(-1px);border-color:var(--gold);box-shadow:0 0 16px rgba(232,182,76,.28)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.jade{border-color:rgba(87,201,155,.5);color:var(--jade-soft)}
.btn.violet{border-color:rgba(160,110,232,.55);color:var(--violet-soft)}
.btn.danger{border-color:rgba(224,96,96,.5);color:#f0a0a0}
.btn.big{font-size:14px;padding:11px 16px}.btn.sm{font-size:11px;padding:4px 8px}
.btn.on{background:linear-gradient(180deg,#2c4a3c,#15281f);border-color:var(--jade);color:#c9f5e2}
.bar{height:11px;background:#060409;border:1px solid rgba(255,255,255,.09);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;transition:width .35s ease;position:relative}
.bar i::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);background-size:200% 100%;animation:shine 3.2s linear infinite}
@keyframes shine{from{background-position:200% 0}to{background-position:-200% 0}}
.bar .hp{background:linear-gradient(90deg,#c04545,#f08a5a)}.bar .qi{background:linear-gradient(90deg,#3f9d7a,#9fe8cb)}.bar .en{background:linear-gradient(90deg,#7a2f5e,#e06090)}
.bar-lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:3px}
.bar-lbl b{color:var(--text);font-weight:500}
#name-input{background:transparent;border:none;border-bottom:1px dashed var(--line);color:var(--gold-soft);font-family:'Cinzel',serif;font-size:15px;width:100%;padding:2px 0;outline:none}
.realm-line{display:flex;align-items:center;gap:10px;margin:10px 0 8px}
.realm-glyph{font-family:'Ma Shan Zheng',serif;font-size:34px;text-shadow:0 0 14px currentColor}
.realm-name{font-family:'Cinzel',serif;font-size:15px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;margin-top:10px;font-size:13px}
.stat-grid div{display:flex;justify-content:space-between;border-bottom:1px dotted rgba(255,255,255,.08);padding:3px 0}
.stat-grid span{color:var(--dim)}.stat-grid b{color:var(--gold-soft);font-weight:500}
.mini{font-size:12px;color:var(--dim);line-height:1.5}.mini em{color:var(--jade-soft);font-style:normal}
.res-row{display:flex;align-items:center;justify-content:space-between;padding:4px 0;border-bottom:1px dotted rgba(255,255,255,.07);font-size:13px}
.res-row .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;box-shadow:0 0 6px currentColor}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{font-size:11.5px;padding:3px 8px;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:#0e0a19}
.chip.act{cursor:pointer}.chip.act:hover{border-color:var(--gold);color:var(--gold-soft)}
.chip.eq{border-color:var(--jade);color:var(--jade-soft)}
#scene-wrap{position:relative;height:360px;border:1px solid var(--line);border-radius:3px;overflow:hidden;box-shadow:0 6px 30px rgba(0,0,0,.55);margin-bottom:12px;background:#0a0816}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
#float-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dmg-float{position:absolute;transform:translate(-50%,0);font-family:'Cinzel',serif;font-weight:700;font-size:19px;text-shadow:0 2px 8px #000,0 0 14px currentColor;animation:floatUp 1s ease-out forwards}
@keyframes floatUp{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-70px)}}
#scene-poem{position:absolute;right:12px;top:14px;writing-mode:vertical-rl;font-family:'Ma Shan Zheng',serif;font-size:21px;color:rgba(244,215,138,.6);letter-spacing:.28em;pointer-events:none;text-shadow:0 0 12px #000}
#zone-hud{position:absolute;top:10px;left:12px;display:flex;gap:8px;align-items:center;pointer-events:none}
#zone-hud .z-g{font-family:'Ma Shan Zheng',serif;font-size:30px;color:var(--gold);text-shadow:0 0 12px rgba(232,182,76,.6)}
#zone-hud .z-n{font-family:'Cinzel',serif;font-size:14px;letter-spacing:.1em;color:#fff;text-shadow:0 1px 6px #000}
#zone-hud .badge{font-size:10.5px;padding:2px 8px;border:1px solid rgba(159,232,203,.5);border-radius:10px;color:var(--jade-soft);background:rgba(10,20,16,.6)}
#realm-flash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 60%,rgba(232,182,76,.4),transparent 65%);opacity:0}
#realm-flash.on{animation:flashUp 1.6s ease forwards}
@keyframes flashUp{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
#no3d{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--dim);font-size:14px;background:linear-gradient(160deg,#171227,#100c1d)}
#actionbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.abtn{flex:1;min-width:96px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 6px;background:linear-gradient(180deg,#221a3a,#140f24);border:1px solid var(--line);border-radius:2px;cursor:pointer;transition:all .18s;color:var(--gold-soft);font-family:'Cinzel',serif;font-size:12px}
.abtn .ag{font-family:'Ma Shan Zheng',serif;font-size:24px;color:var(--jade);line-height:1}
.abtn:hover:not(.off){transform:translateY(-2px);border-color:var(--gold);box-shadow:0 4px 18px rgba(232,182,76,.22)}
.abtn.off{opacity:.45;cursor:not-allowed}
.abtn .cd{font-size:10px;color:var(--violet-soft);height:12px}
.pillrow{display:flex;gap:6px;align-items:center}.pillrow .btn{font-size:10.5px;padding:7px 8px}
#tabs{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:-1px;position:relative;z-index:2}
#tabs button{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.08em;color:var(--dim);background:#120e1f;border:1px solid rgba(255,255,255,.08);border-bottom:none;padding:8px 13px;cursor:pointer;border-radius:4px 4px 0 0}
#tabs button .zg{font-family:'Ma Shan Zheng',serif;margin-right:5px;color:var(--violet);font-size:15px}
#tabs button:hover{color:var(--gold-soft)}
#tabs button.act{color:var(--gold);background:linear-gradient(180deg,var(--panel2),var(--panel));border-color:var(--line);box-shadow:inset 0 2px 0 var(--gold)}
#tab-panel{min-height:340px}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
.card{background:#120d20;border:1px solid rgba(255,255,255,.09);border-radius:3px;padding:10px 12px;transition:all .18s}
.card:hover{border-color:rgba(232,182,76,.5);transform:translateY(-2px)}
.card .c-name{font-family:'Cinzel',serif;font-size:13.5px;margin-bottom:4px}
.card .c-sub{font-size:11.5px;color:var(--dim);margin-bottom:6px;line-height:1.45}
.card .c-stats{font-size:12px;color:var(--jade-soft);margin-bottom:6px}
.card .c-cost{font-size:12px;color:var(--gold-soft);margin-bottom:8px}
.grade{display:inline-block;font-size:10px;letter-spacing:.1em;padding:1px 7px;border:1px solid currentColor;border-radius:9px;margin-bottom:5px}
.card.owned{border-color:rgba(87,201,155,.4)}.card.locked{opacity:.55}
.req-no{color:#f0a0a0;font-size:11px}.req-ok{color:var(--jade-soft);font-size:11px}
#log{height:430px;overflow-y:auto;padding-right:6px;font-size:13px;line-height:1.45}
.log-line{padding:4px 8px 4px 10px;border-left:2px solid #444;margin-bottom:4px;animation:slideIn .3s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.log-sistema{color:var(--dim);border-color:#555}.log-good{color:var(--jade-soft);border-color:var(--jade)}
.log-bad{color:#f0a0a0;border-color:var(--red)}.log-oro{color:var(--gold-soft);border-color:var(--gold)}
.log-arcano{color:var(--violet-soft);border-color:var(--violet)}.log-combate{color:#e8c8a0;border-color:#c07a3a}
.log-titulo{color:#ffd9a0;border-color:#ffb347;font-family:'Cinzel',serif}
.modal{position:fixed;inset:0;background:rgba(5,3,10,.82);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:50}
.modal.hidden{display:none}
.combat-box{width:min(560px,94vw);background:linear-gradient(170deg,#1a1130,#0e0a18);border:1px solid rgba(224,96,96,.45);border-radius:4px;padding:18px;box-shadow:0 0 60px rgba(160,110,232,.25)}
.combat-box h3{font-family:'Cinzel',serif;color:#f0b0a0;font-size:16px;letter-spacing:.1em;text-align:center;margin-bottom:4px}
.kind-tag{text-align:center;font-size:11px;color:var(--dim);letter-spacing:.16em;text-transform:uppercase;margin-bottom:12px}
.cb-bars{display:grid;gap:8px;margin-bottom:10px}
#combat-feed{height:130px;overflow-y:auto;background:#090612;border:1px solid rgba(255,255,255,.08);padding:8px 10px;font-size:12.5px;margin:10px 0;line-height:1.5}
#combat-feed p{margin-bottom:3px;animation:slideIn .25s ease}
.cf-p{color:var(--jade-soft)}.cf-e{color:#f0a0a0}.cf-n{color:var(--dim)}.cf-g{color:var(--gold-soft)}
.combat-actions{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.combat-result{text-align:center;padding:14px 0;font-family:'Cinzel',serif;font-size:18px;letter-spacing:.12em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.mt{margin-top:10px}.mb{margin-bottom:10px}
.list-line{display:flex;justify-content:space-between;gap:10px;padding:6px 8px;border-bottom:1px dotted rgba(255,255,255,.08);font-size:13px}
.list-line.cur{background:rgba(232,182,76,.07);border-left:2px solid var(--gold)}
.counters{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12.5px}
.counters div{background:#0e0a19;border:1px solid rgba(255,255,255,.07);padding:6px 9px}
.counters b{color:var(--gold-soft);float:right;font-weight:500}
.note{font-size:12px;color:var(--dim);font-style:italic;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand"><span class="glyph">仙</span>
      <div><h1>SENDA DEL INMORTAL · 3D</h1><p>Crónicas de cultivo al estilo de The Untamed · 修仙之路</p></div>
    </div>
    <div class="head-right"><span id="save-ind">✦ Guardado</span>
      <button class="btn danger sm" data-act="reset">Reiniciar partida</button></div>
  </header>
  <main class="layout">
    <aside id="col-left">
      <section class="panel" id="p-char"></section>
      <section class="panel" id="p-equip"></section>
      <section class="panel" id="p-res"></section>
    </aside>
    <section id="col-center">
      <div id="scene-wrap">
        <canvas id="scene"></canvas>
        <div id="float-layer"></div>
        <div id="scene-poem"></div>
        <div id="zone-hud"></div>
        <div id="realm-flash"></div>
        <div id="no3d">⚠ No se pudo cargar el motor 3D (Three.js).<br>Necesitas conexión a internet la primera vez.<br>El juego sigue siendo jugable desde los paneles.</div>
      </div>
      <div id="actionbar"></div>
      <nav id="tabs">
        <button data-act="tab" data-id="secta"><span class="zg">宗</span>Secta</button>
        <button data-act="tab" data-id="tienda"><span class="zg">宝</span>Tienda</button>
        <button data-act="tab" data-id="alquimia"><span class="zg">丹</span>Alquimia</button>
        <button data-act="tab" data-id="misiones"><span class="zg">任</span>Misiones</button>
        <button data-act="tab" data-id="maestro"><span class="zg">师</span>Maestro</button>
        <button data-act="tab" data-id="viaje"><span class="zg">游</span>Viaje</button>
        <button data-act="tab" data-id="torneo"><span class="zg">武</span>Torneo</button>
      </nav>
      <section class="panel" id="tab-panel"></section>
    </section>
    <aside id="col-right">
      <section class="panel"><h2><span class="zg">录</span>Registro del Destino</h2><div id="log"></div></section>
      <section class="panel"><h2><span class="zg">迹</span>Crónicas</h2><div class="counters" id="counters"></div></section>
    </aside>
  </main>
</div>
<div id="combat-modal" class="modal hidden">
  <div class="combat-box">
    <h3 id="cb-name"></h3><div class="kind-tag" id="cb-kind"></div>
    <div class="cb-bars">
      <div><div class="bar-lbl"><span id="cb-pname"></span><span id="cb-php"></span></div><div class="bar"><i class="hp" id="cb-pbar"></i></div></div>
      <div><div class="bar-lbl"><span id="cb-ename"></span><span id="cb-ehp"></span></div><div class="bar"><i class="en" id="cb-ebar"></i></div></div>
    </div>
    <div id="combat-feed"></div>
    <div class="combat-actions" id="combat-actions"></div>
  </div>
</div>
<script>
'use strict';
/* ========== 1. UTILIDADES ========== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a, chance=p=>Math.random()*100<p;
const pick=a=>a[rnd(0,a.length-1)], clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=n=>{n=Math.floor(n);return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':String(n);};
function mergeDeep(b,e){for(const k of Object.keys(e)){const a=b[k],v=e[k];
  if(v&&typeof v==='object'&&!Array.isArray(v)&&a&&typeof a==='object'&&!Array.isArray(v?0:a)&&a&&typeof a==='object'&&!Array.isArray(a))mergeDeep(a,v);else b[k]=v;}return b;}

/* ========== 2. DATOS DEL MUNDO ========== */
const SAVE_KEY='senda-inmortal-3d-v1';
const STONES=['low','mid','high','cel'];
const STONE_UI={low:{n:'Piedra Baja',c:'#9fd0a8'},mid:{n:'Piedra Media',c:'#7ab7e8'},high:{n:'Piedra Alta',c:'#c9a0ff'},cel:{n:'Piedra Celestial',c:'#ffe08a'}};
const REALMS=[
  {name:'Refinamiento de Qi',glyph:'气',color:'#8fd3a8'},{name:'Fundación',glyph:'基',color:'#5fd6c0'},
  {name:'Núcleo Dorado',glyph:'丹',color:'#f2c14e'},{name:'Alma Nascente',glyph:'婴',color:'#f08c4e'},
  {name:'Alma Divina',glyph:'魂',color:'#c58ae8'},{name:'Inmortal Terrenal',glyph:'地',color:'#8ab6ff'},
  {name:'Inmortal Celestial',glyph:'仙',color:'#ffe9a3'}];
const BREAK_PILL=[null,'fundacion','nucleo','nascente','divina','terrenal','celestial'];
const BREAK_CHANCE=[100,92,82,72,62,52,42];
const PILLS={
  qi:{name:'Píldora de Qi',cost:{low:30},desc:'Otorga experiencia de cultivo.'},
  curacion:{name:'Píldora de Curación',cost:{low:20},desc:'Restaura el 40% de los PV.'},
  cuerpo:{name:'Píldora de Fortalecimiento Físico',cost:{low:45},desc:'+1 nivel de Cuerpo.'},
  velocidad:{name:'Píldora de Velocidad',cost:{low:35},desc:'+30% velocidad en el próximo combate.'},
  fundacion:{name:'Píldora de Establecimiento de Fundación',cost:{low:400},desc:'Para alcanzar la Fundación.'},
  nucleo:{name:'Píldora del Núcleo Dorado',cost:{mid:30},desc:'Para condensar el Núcleo Dorado.'},
  nascente:{name:'Píldora del Alma Nascente',cost:{mid:140},desc:'Para dar a luz el Alma Nascente.'},
  divina:{name:'Píldora del Alma Divina',cost:{high:30},desc:'Para templar el Alma Divina.'},
  terrenal:{name:'Píldora del Inmortal Terrenal',cost:{high:130},desc:'Para trascender como Inmortal Terrenal.'},
  celestial:{name:'Píldora del Inmortal Celestial',cost:{cel:25},desc:'Para ascender a Inmortal Celestial.'}};
const HERBS={hierba_lunar:{name:'Hierba Recolectora de Qi',sell:6},flor_vital:{name:'Flor de Vitalidad',sell:8},
  raiz_forja:{name:'Raíz Forja-Huesos',sell:9},hierba_viento:{name:'Hierba del Viento',sell:10},
  liana_purpura:{name:'Liana de Ganancia Púrpura',sell:18},rocio_jade:{name:'Rocío de Jade',sell:35},
  flor_inmortal:{name:'Flor del Espíritu Inmortal',sell:80},loto_caos:{name:'Loto del Caos',sell:200}};
const MINERALS={mineral_hierro:{name:'Esencia de Hierro',sell:10},mineral_plata:{name:'Plata Espiritual',sell:22},
  mineral_bronce:{name:'Bronce Estelar',sell:45},mineral_cristal:{name:'Cristal Solar',sell:110},mineral_vacio:{name:'Piedra del Vacío',sell:280}};
const RECIPES={qi:{hierba_lunar:2},curacion:{hierba_lunar:1,flor_vital:1},cuerpo:{raiz_forja:2},velocidad:{hierba_viento:2},
  fundacion:{hierba_lunar:4,liana_purpura:1},nucleo:{liana_purpura:3,rocio_jade:2},nascente:{rocio_jade:3,flor_inmortal:2},
  divina:{flor_inmortal:4,loto_caos:1},terrenal:{flor_inmortal:2,loto_caos:3},celestial:{loto_caos:5}};
const GRADE_UI={Amarillo:'#d8c07a',Profundo:'#7fd0c0',Misterioso:'#7aa7f0',Tierra:'#b48ae8',Cielo:'#f0c35e',Divino:'#ff9f6e',Primordial:'#ffd7a0'};

/* ========== 4. ESTADÍSTICAS ========== */
const totalQi=()=>state.realm*9+state.level;
const curZone=()=>ZONE_MAP[state.zone];
const qiNeed=()=>Math.round(40+30*Math.pow(totalQi(),1.55));
const qiPillPower=()=>Math.round((60+totalQi()*30)*getStats().xpMult);
function resBucket(k){if(STONES.includes(k))return state.stones;if(HERBS[k])return state.herbs;if(MINERALS[k])return state.minerals;if(PILLS[k])return state.pills;return null;}
const getRes=k=>(resBucket(k)||{})[k]||0;
function addRes(k,n){const b=resBucket(k);if(b){b[k]=Math.max(0,(b[k]||0)+n);return true;}return false;}
function canPay(c){return Object.entries(c).every(([k,v])=>getRes(k)>=v);}
function pay(c){Object.entries(c).forEach(([k,v])=>addRes(k,-v));}
function costTxt(c){if(!c)return'—';return Object.entries(c).map(([k,v])=>STONES.includes(k)?`${v} ${STONE_UI[k].n}`:HERBS[k]?`${v} ${HERBS[k].name}`:MINERALS[k]?`${v} ${MINERALS[k].name}`:`${v} ${k}`).join(' · ');}
function applyTech(s,id,lv){switch(id){
  case 'paso_viento':s.spd+=3*lv;break;case 'sombra_veloz':s.spd+=5*lv;s.dodge+=lv;break;
  case 'vuelo_grulla':s.canFly=true;s.spd+=4*lv;break;case 'vuelo_dragon':s.canFly=true;s.spd+=7*lv;s.atk+=2*lv;break;
  case 'vuelo_fenix':s.canFly=true;s.spd+=10*lv;s.spi+=4*lv;break;case 'puno_hierro':s.atk+=2*lv;break;
  case 'palma_fuego':s.atk+=3*lv;break;case 'espada_trueno':s.atk+=4*lv;s.crit+=lv;break;
  case 'corte_vacio':s.atk+=6*lv;s.crit+=lv;break;case 'piel_hierro':s.def+=4*lv;break;
  case 'huesos_jade':s.def+=6*lv;s.hpMult+=.02*lv;break;case 'cuerpo_inmortal':s.hpMult+=.03*lv;s.atk+=3*lv;s.def+=3*lv;break;
  case 'respiracion':s.xpMult+=.06*lv;break;case 'absorcion':s.xpMult+=.10*lv;break;
  case 'meditacion':s.xpMult+=.14*lv;s.btBonus+=.03*lv;break;}}
function getStats(){
  const t=totalQi();
  const s={hp:90+t*34,atk:8+t*5,def:5+t*3,spd:7+t*2,spi:6+Math.round(t*2.4),crit:8,dodge:5,rewardMult:1,xpMult:1,btBonus:0,canFly:false,hpMult:1};
  const w=WEAPON_MAP[state.weapons.eq];if(w){s.atk+=w.atk;s.def+=w.def;s.spd+=w.spd;s.spi+=w.spi;}
  const r=ROBE_MAP[state.robes.eq.type];if(r){s.atk+=r.atk||0;s.def+=r.def||0;s.spd+=r.spd||0;s.spi+=r.spi||0;s.dodge+=r.dodge||0;s.rewardMult+=(r.reward||0)/100;s.hpMult+=(r.hp||0)/100;}
  for(const[id,tt]of Object.entries(state.techs))applyTech(s,id,tt.lv);
  const c=state.cuerpo;
  if(c>=10)s.hpMult+=.2;if(c>=20)s.def*=1.15;if(c>=50)s.atk*=1.25;if(c>=60)s.dodge+=10;if(c>=70)s.crit+=10;if(c>=80)s.hpMult+=.5;
  if(c>=100){s.hpMult*=1.2;s.atk*=1.2;s.def*=1.2;s.spd*=1.2;s.spi*=1.2;}
  s.spi+=state.titles.length*2;
  s.hp+=state.bonus.hp;s.atk+=state.bonus.atk;s.def+=state.bonus.def;s.spd+=state.bonus.spd;s.spi+=state.bonus.spi;
  s.hp=Math.round(s.hp*s.hpMult);['atk','def','spd','spi','crit','dodge'].forEach(k=>s[k]=Math.round(s[k]));
  s.crit=clamp(s.crit,0,60);s.dodge=clamp(s.dodge,0,65);return s;}
function syncHp(){const m=getStats().hp;if(state.hp<=0||state.hp>m)state.hp=m;}
function healPct(p){const m=getStats().hp;state.hp=Math.min(m,state.hp+Math.round(m*p));}
function addTechXp(cat,n){const o=Object.entries(state.techs).filter(([id])=>TECH_MAP[id].cat===cat);if(!o.length)return;
  o.sort((a,b)=>b[1].lv-a[1].lv);const[,t]=o[0];if(t.lv<10)t.xp+=n;}

/* ========== 5. LOG Y GANCHOS ========== */
function log(msg,type='sistema'){const el=document.createElement('div');el.className='log-line log-'+type;el.innerHTML=msg;
  const b=$('#log');b.prepend(el);while(b.children.length>130)b.lastChild.remove();}
function matchGoal(g,type,id){if(g.what==='kill'&&(type==='kill_beast'||type==='kill_rival'))return true;return g.what===type&&(!g.id||g.id===id);}
function hook(type,n=1,id=null){
  if(type==='cultivar')state.stats.cultivar+=n;if(type==='gather')state.stats.gather+=n;
  if(type==='kill_beast')state.stats.beasts+=n;if(type==='kill_rival')state.stats.rivals+=n;
  state.missions.active=state.missions.active.filter(m=>{const g=MISSION_BY_PID[m.pid].goal;
    if(!matchGoal(g,type,id))return true;m.prog+=n;if(m.prog>=g.n){completeMission(m);return false;}return true;});}
function completeMission(m){const d=MISSION_BY_PID[m.pid];state.misiones++;const parts=[];
  Object.entries(d.reward).forEach(([k,v])=>{if(k==='contrib'){state.contrib+=v;parts.push(`+${v} Contribución`);}else{addRes(k,v);parts.push(`+${v} ${PILLS[k]?PILLS[k].name:k}`);}});
  log(`🏮 <b>Misión cumplida:</b> ${d.name}. Recompensa: ${parts.join(', ')}.`,'oro');}

/* ========== 6. ACCIONES DE CULTIVO ========== */
function addQi(x){state.qi+=x;let sub=false;
  while(state.level<9&&state.qi>=qiNeed()){state.qi-=qiNeed();state.level++;sub=true;healPct(.2);
    log(`✨ Alcanzas el nivel <b>${state.level}</b> de ${REALMS[state.realm].name}.`,'good');}
  if(state.level===9)state.qi=Math.min(state.qi,qiNeed());
  if(sub)Scene.burst(REALMS[state.realm].color);}
function actCultivar(){if(Combat.data)return;const S=getStats();
  const g=Math.round((7+totalQi()*3.4)*S.xpMult*(1+state.realm*.15));
  addQi(g);healPct(.08);if(state.cuerpo>=40)healPct(.02);addTechXp('qi',2);hook('cultivar');Scene.cultivatePulse();
  if(chance(12)){const s=rnd(3,8)+totalQi();state.stones.low+=s;log(`🧘 Encuentras ${s} piedras entre la maleza.`,'good');}
  log(`🧘 Cultivas el qi del cielo y la tierra: <b>+${fmt(g)} Qi</b>.`,'good');renderAll();scheduleSave();}
function breakthroughChance(){const S=getStats();return clamp(BREAK_CHANCE[state.realm+1]+S.btBonus*100+S.spi*.05,5,98);}
function actBreakthrough(){if(Combat.data||state.realm>=6||state.level<9)return;
  const pid=BREAK_PILL[state.realm+1];if(state.pills[pid]<1)return log(`Necesitas una <b>${PILLS[pid].name}</b>.`,'bad');
  state.pills[pid]--;const ch=breakthroughChance();
  if(chance(ch)){state.realm++;state.level=1;state.qi=0;state.hp=getStats().hp;
    log(`🌩️ ¡EL CIELO SE ESTREMECE! Entras en el reino de <b>${REALMS[state.realm].name}</b>.`,'arcano');
    Scene.realmBurst();const f=$('#realm-flash');f.classList.remove('on');void f.offsetWidth;f.classList.add('on');}
  else{const m=getStats().hp;state.hp=Math.max(1,state.hp-Math.round(m*.4));
    log(`💥 ¡Desviación de qi! El avance falla (${Math.round(ch)}%).`,'bad');}
  renderAll();scheduleSave();}
function usePill(id){if(Combat.data)return;if(state.pills[id]<1)return log('No te queda esa píldora.','bad');
  if(id==='qi'){state.pills.qi--;const g=qiPillPower();addQi(g);log(`💊 Píldora de Qi: <b>+${fmt(g)} Qi</b>.`,'good');}
  if(id==='curacion'){state.pills.curacion--;healPct(.4);log('💊 Píldora de Curación: +40% PV.','good');}
  if(id==='cuerpo'){if(state.cuerpo>=100)return log('Tu cuerpo ya es perfecto: nivel 100.','sistema');
    state.pills.cuerpo--;state.cuerpo++;addTechXp('body',2);log(`💪 Cuerpo nivel <b>${state.cuerpo}</b>.`,'good');
    const h=BODY_PASSIVES.find(p=>p[0]===state.cuerpo);if(h)log(`🔓 Pasiva: <b>${h[1]}</b> — ${h[2]}.`,'arcano');}
  if(id==='velocidad'){if(state.buffVelocidad)return log('Ya estás bajo ese efecto.','sistema');
    state.pills.velocidad--;state.buffVelocidad=true;log('💨 +30% velocidad en el próximo combate.','good');}
  renderAll();scheduleSave();}
const cdReady=k=>!cds[k]||Date.now()>=cds[k];
function actHeal(){if(Combat.data||!cdReady('heal'))return;const S=getStats();
  if(state.hp>=S.hp)return log('Estás ileso.','sistema');cds.heal=Date.now()+6000;healPct(.3);
  log('🕯️ Meditas y sanas: +30% PV.','good');renderAll();scheduleSave();}

/* ========== 7. RECOLECCIÓN, CAZA, VIAJE ========== */
function weightedPick(t){const e=Object.entries(t),tw=e.reduce((a,[,w])=>a+w,0);let r=Math.random()*tw;
  for(const[k,w]of e){r-=w;if(r<=0)return k;}return e[0][0];}
function actGather(){if(Combat.data)return;const z=curZone();
  if(!z.gather||!Object.keys(z.gather).length)return log('Aquí no hay nada que recolectar.','sistema');
  if(chance(12)&&z.enemies.length){log('⚠️ ¡Emboscada mientras recolectas!','bad');Combat.start({...pick(z.enemies),ambush:true},{t:'emboscada'});renderAll();return;}
  const k=weightedPick(z.gather);addRes(k,1);addTechXp('mov',1);hook('gather');
  log(`🌿 Recolectas: <b>${HERBS[k]?HERBS[k].name:MINERALS[k].name}</b>.`,'good');
  if(state.cuerpo>=40)healPct(.02);renderAll();scheduleSave();}
function actHunt(){if(Combat.data)return;const z=curZone();
  if(z.safe)return log('Zona segura. Viaja a tierras salvajes para cazar.','sistema');
  Combat.start(pick(z.enemies),{t:'caza'});renderAll();}
function canEnterZone(z){const S=getStats();
  if(z.reqFly&&!(S.canFly&&state.flying))return 'requiere volar (técnica de vuelo activa)';
  if(z.reqRealm&&state.realm<z.reqRealm)return `requiere reino ${REALMS[z.reqRealm].name}`;
  if(z.reqShip){const eq=state.ships.eq;const ok=z.reqShip==='celestial'?(eq==='celestial'||eq==='divino'):eq==='divino';
    if(!ok)return `requiere ${SHIP_MAP[z.reqShip].name} equipado`;}
  return null;}
function actTravel(id){if(Combat.data||id===state.zone)return;const z=ZONE_MAP[id];const err=canEnterZone(z);
  if(err)return log(`🚫 No puedes llegar a ${z.name}: ${err}.`,'bad');
  state.zone=id;hook('visit',1,id);Scene.travelDash();log(`🧭 Viajas a <b>${z.name}</b>. ${z.desc}`,'oro');renderAll();scheduleSave();}
function actFly(){const S=getStats();if(!S.canFly)return log('Aún no conoces técnicas de vuelo.','sistema');
  state.flying=!state.flying;log(state.flying?'🕊️ Te elevas sobre tu espada: el mundo se abre bajo tus pies.':'🌾 Desciendes a la tierra.','good');renderAll();scheduleSave();}

/* ========== 8. COMBATE ========== */
function makeEnemy(spec){const z=curZone();const p=spec.power!=null?spec.power:z.power+(spec.o||0)+rnd(0,2);
  return{name:spec.n||spec.name,kind:spec.k||'bestia',poison:!!spec.poison,power:p,
    hp:80+p*30,atk:8+p*5,def:4+Math.round(p*2.6),spd:7+p*2,spi:5+p*2};}
function hitRoll(atk,def,critC,dodgeC){if(chance(dodgeC))return{dodge:true};
  let d=atk*(0.85+Math.random()*0.3)-def*0.5;const c=chance(critC);if(c)d*=1.8;
  return{dmg:Math.max(1,Math.round(d)),crit:c};}
const KIND_NAME={bestia:'Bestia demoníaca',rival:'Cultivador rival',guardian:'Guardián'};
const Combat={data:null,
  start(spec,ctx){const P=getStats();const e=makeEnemy(spec);
    this.data={ctx,enemy:e,ehp:e.hp,php:state.hp,P,buffSpd:state.buffVelocidad?1.3:1,poison:0,burn:0,usedSpeed:state.buffVelocidad,busy:false,over:false};
    state.buffVelocidad=false;Scene.setEnemy(e);
    $('#combat-modal').classList.remove('hidden');$('#cb-name').textContent=e.name;
    $('#cb-kind').textContent=KIND_NAME[e.kind]+(spec.ambush?' · ¡Emboscada!':'')+` · Poder ${e.power}`;
    $('#cb-pname').textContent=state.nombre;$('#cb-ename').textContent=e.name;$('#combat-feed').innerHTML='';
    this.feed(`⚔️ ¡${e.name} aparece entre la niebla!`,'cf-n');this.render();
    if(spec.ambush){this.data.busy=true;setTimeout(()=>this.enemyTurn(),700);}},
  feed(m,c='cf-n'){const p=document.createElement('p');p.className=c;p.innerHTML=m;const f=$('#combat-feed');f.appendChild(p);f.scrollTop=f.scrollHeight;},
  pSpd(){return this.data.P.spd*this.data.buffSpd;},
  render(){const d=this.data;if(!d)return;
    $('#cb-php').textContent=`${Math.max(0,d.php)} / ${d.P.hp}`;$('#cb-pbar').style.width=clamp(d.php/d.P.hp*100,0,100)+'%';
    $('#cb-ehp').textContent=`${Math.max(0,d.ehp)} / ${d.enemy.hp}`;$('#cb-ebar').style.width=clamp(d.ehp/d.enemy.hp*100,0,100)+'%';
    const techs=Object.entries(state.techs).filter(([id])=>TECH_MAP[id].cat==='comb')
      .map(([id,t])=>`<button class="btn violet" data-act="c_tech" data-id="${id}" ${d.busy||d.over?'disabled':''}>${TECH_MAP[id].name} Nv${t.lv}</button>`).join('');
    $('#combat-actions').innerHTML=d.over
      ?`<div class="combat-result" style="color:${d.won?'var(--gold-soft)':'var(--red)'}">${d.won?'✦ VICTORIA ✦':d.fled?'🏃 HUIDA':'☠ DERROTA ☠'}</div><div style="text-align:center;width:100%"><button class="btn big" data-act="c_close">Continuar</button></div>`
      :`<button class="btn big" data-act="c_attack" ${d.busy?'disabled':''}>⚔ Atacar</button>${techs}
        <button class="btn jade" data-act="c_heal" ${d.busy||state.pills.curacion<1?'disabled':''}>💊 Curación (${state.pills.curacion})</button>
        <button class="btn" data-act="c_speed" ${d.busy||d.usedSpeed||state.pills.velocidad<1?'disabled':''}>💨 Velocidad (${state.pills.velocidad})</button>
        <button class="btn danger" data-act="c_flee" ${d.busy?'disabled':''}>🏃 Huir</button>`;},
  guard(){return !this.data||this.data.busy||this.data.over;},
  playerStrike(mult,label,opts={}){const d=this.data,e=d.enemy,P=d.P;d.busy=true;Scene.lunge();
    const eDodge=clamp(4+(e.spd-this.pSpd())*.15,2,35);const roll=hitRoll(P.atk*mult,e.def,P.crit+(opts.critBonus||0),eDodge);
    if(roll.dodge)this.feed(`${e.name} esquiva tu ${label}.`,'cf-e');
    else{d.ehp-=roll.dmg;Scene.hitEnemy();Scene.floatEnemy('-'+roll.dmg,roll.crit?'#ffd76a':'#ff9d6a');
      this.feed(`Lanzas <b>${label}</b>: ${roll.dmg} de daño${roll.crit?' <b>¡CRÍTICO!</b>':''}.`,'cf-p');
      if(opts.burn&&d.burn<=0){d.burn=3;this.feed(`🔥 ¡${e.name} arde en llamas espirituales!`,'cf-p');}}
    addTechXp('mov',1);this.render();if(d.ehp<=0)return this.win();
    setTimeout(()=>this.enemyTurn(),620);},
  attack(){if(this.guard())return;this.playerStrike(1,'tu ataque');},
  useTech(id){if(this.guard())return;const t=TECH_MAP[id],o=state.techs[id];if(!t||!o)return;
    o.xp+=3;this.playerStrike(t.mult+.08*o.lv,t.name,{burn:t.burn,critBonus:id==='espada_trueno'?10:0});},
  useHeal(){if(this.guard()||state.pills.curacion<1)return;const d=this.data;state.pills.curacion--;
    const h=Math.round(d.P.hp*.4);d.php=Math.min(d.P.hp,d.php+h);this.feed(`💊 +${h} PV.`,'cf-p');
    d.busy=true;this.render();setTimeout(()=>this.enemyTurn(),620);},
  useSpeed(){const d=this.data;if(!d||d.usedSpeed||state.pills.velocidad<1)return;
    state.pills.velocidad--;d.buffSpd=1.3;d.usedSpeed=true;this.feed('💨 ¡Velocidad +30%!','cf-p');this.render();},
  flee(){if(this.guard())return;const d=this.data;const ch=clamp(45+(this.pSpd()-d.enemy.spd)*.5,20,90);
    if(chance(ch)){this.feed('🏃 Escapas entre la niebla…','cf-n');log('🏃 Huyes sin honor ni botín.','sistema');
      d.over=true;d.won=false;d.fled=true;this.render();return;}
    this.feed('¡No logras escapar!','cf-e');d.busy=true;this.render();setTimeout(()=>this.enemyTurn(),500);},
  enemyTurn(){const d=this.data;if(!d||d.over)return;const e=d.enemy,P=d.P;
    if(d.burn>0){d.burn--;const b=Math.max(1,Math.round(P.spi*.4));d.ehp-=b;Scene.floatEnemy('-'+b,'#ff8c4e');
      this.feed(`🔥 Las llamas consumen a ${e.name}: ${b}.`,'cf-p');if(d.ehp<=0)return this.win();}
    if(d.poison>0&&state.cuerpo<30){d.poison--;const p=Math.max(1,Math.round(P.hp*.05));d.php-=p;
      Scene.floatPlayer('-'+p,'#9fe85a');this.feed(`☠ Veneno: ${p} de daño.`,'cf-e');if(d.php<=0)return this.lose();}
    const pDodge=clamp(P.dodge+(this.pSpd()-e.spd)*.15,3,60);const fierce=chance(15);
    const roll=hitRoll(e.atk*(fierce?1.5:1),P.def,6,pDodge);
    if(roll.dodge){this.feed(`Esquivas el ataque de ${e.name}.`,'cf-p');
      if(chance(state.cuerpo>=90?55:35)){const c=Math.max(1,Math.round(P.atk*(state.cuerpo>=90?.9:.6)-e.def*.4));
        d.ehp-=c;Scene.hitEnemy();Scene.floatEnemy('-'+c,'#9fe8cb');this.feed(`⚡ ¡Contragolpe! ${c} de daño.`,'cf-p');
        if(d.ehp<=0)return this.win();}}
    else{d.php-=roll.dmg;Scene.hitPlayer();Scene.floatPlayer('-'+roll.dmg,'#ff6a6a');
      this.feed(`${e.name} ${fierce?'desata un golpe feroz':'te golpea'}: ${roll.dmg}.`,'cf-e');
      if(e.poison&&state.cuerpo<30&&d.poison<=0&&chance(40)){d.poison=3;this.feed('☠ ¡Has sido envenenado!','cf-e');}
      if(d.php<=0)return this.lose();}
    if(state.cuerpo>=40)d.php=Math.min(d.P.hp,d.php+Math.round(d.P.hp*.03));
    d.busy=false;this.render();},
  win(){const d=this.data;d.over=true;d.won=true;d.busy=true;state.hp=Math.max(1,d.php);
    const e=d.enemy,rm=d.P.rewardMult,xp=Math.round(e.power*9*(e.kind==='rival'?1.25:1));addQi(xp);
    const g=[`+${fmt(xp)} Qi`];let st=Math.round((rnd(6,10)+e.power*2)*(e.kind==='rival'?2:1)*rm);
    state.stones.low+=st;g.push(`+${st} Piedras Bajas`);const drops=[];
    if(e.kind==='rival'&&chance(30)){state.stones.mid+=2;g.push('+2 Piedras Medias');}
    if(e.kind==='bestia'){if(chance(32)){state.pills.cuerpo++;drops.push('Píldora de Fortalecimiento Físico');}
      if(chance(45)){const h=weightedPick(curZone().gather||{hierba_lunar:1});if(HERBS[h]){state.herbs[h]++;drops.push(HERBS[h].name);}}
      if(chance(35)){const ks=Object.keys(MINERALS);const m=ks[clamp(Math.floor(e.power/12),0,4)];state.minerals[m]++;drops.push(MINERALS[m].name);}
      hook('kill_beast');}
    else{if(chance(15)){const u=TECHS.filter(t=>!state.techs[t.id]);
        if(u.length){const t=pick(u);state.techs[t.id]={lv:1,xp:0};drops.push(`Manual: ${t.name}`);log(`📖 ¡Botín raro! Obtienes <b>${t.name}</b>.`,'arcano');}
        else{state.stones.mid+=6;drops.push('6 Piedras Medias');}}
      if(chance(30)){const c=pick(ROBE_COLORS.filter(c=>c.cost&&!state.robes.colors.includes(c.id)));if(c){state.robes.colors.push(c.id);drops.push(`Tinte ${c.name}`);}}
      hook('kill_rival');}
    log(`🏆 Derrotas a <b>${e.name}</b>: ${g.join(', ')}${drops.length?' · Botín: '+drops.join(', '):''}.`,'oro');
    Scene.setEnemy(null);Scene.burst('#ffd76a');
    if(d.ctx.t==='torneo')torneoVictoria(d.ctx);
    this.render();renderAll();scheduleSave();},
  lose(){const d=this.data;d.over=true;d.won=false;d.busy=true;
    const lost=Math.floor(state.stones.low*.15);state.stones.low-=lost;state.hp=1;state.zone='secta';state.flying=false;
    log(`☠ <b>${d.enemy.name}</b> te derrota. Pierdes ${lost} piedras y despiertas en la secta.`,'bad');
    if(d.ctx.t==='torneo')log('🥀 Eliminado del torneo.','sistema');
    Scene.setEnemy(null);this.render();renderAll();scheduleSave();},
  close(){this.data=null;$('#combat-modal').classList.add('hidden');Scene.setEnemy(null);renderAll();}};

/* ========== 9. SECTA, MISIONES, MAESTRO, TORNEO ========== */
function actServe(){if(Combat.data||!cdReady('serve'))return;cds.serve=Date.now()+4000;
  state.contrib+=3;state.stones.low+=8;hook('serve');log('🏮 Sirves a la secta: +3 Contribución, +8 Piedras Bajas.','good');renderAll();scheduleSave();}
function actPromote(){const n=RANKS[state.rank+1];if(!n)return log('Ya ostentas el rango supremo.','sistema');
  if(totalQi()<n.total)return log(`Necesitas poder ${n.total} (tienes ${totalQi()}).`,'bad');
  if(state.misiones<n.missions)return log(`Necesitas ${n.missions} misiones (tienes ${state.misiones}).`,'bad');
  if(state.contrib<n.contrib)return log(`Necesitas ${n.contrib} de Contribución.`,'bad');
  state.contrib-=n.contrib;state.rank++;
  log(`🎊 ¡Ascenso! Ahora eres <b>${RANKS[state.rank].name}</b>. Tu maestro es <b>${MASTERS[state.rank]}</b>.`,'arcano');
  Scene.burst('#f4d78a');renderAll();scheduleSave();}
function actMissionNew(){if(state.missions.offer)return;if(state.missions.active.length>=3)return log('Ya tienes 3 misiones.','sistema');
  const p=MISSIONS.filter(m=>!state.missions.active.some(a=>a.pid===m.pid));if(!p.length)return;
  state.missions.offer=pick(p).pid;renderAll();scheduleSave();}
function actMissionTake(){if(!state.missions.offer||state.missions.active.length>=3)return;
  state.missions.active.push({pid:state.missions.offer,prog:0});
  log(`📜 Aceptas: <b>${MISSION_BY_PID[state.missions.offer].name}</b>.`,'sistema');state.missions.offer=null;renderAll();scheduleSave();}
function actMissionDrop(id){state.missions.active=state.missions.active.filter(m=>m.pid!==id);renderAll();scheduleSave();}
function masterQuestReady(q){const g=q.goal;
  if(g.what==='kill_beast')return state.stats.beasts>=g.n;if(g.what==='kill_rival')return state.stats.rivals>=g.n;
  if(g.what==='body')return state.cuerpo>=g.n;if(g.what==='realm')return state.realm>=g.n;
  if(g.what==='total')return totalQi()>=g.n;return false;}
function masterQuestProgress(q){const g=q.goal;
  if(g.what==='kill_beast')return Math.min(state.stats.beasts,g.n)+' / '+g.n;
  if(g.what==='kill_rival')return Math.min(state.stats.rivals,g.n)+' / '+g.n;
  if(g.what==='body')return `Cuerpo ${state.cuerpo} / ${g.n}`;
  if(g.what==='realm')return `${REALMS[state.realm].name} / ${REALMS[g.n].name}`;
  if(g.what==='total')return `Poder ${totalQi()} / ${g.n}`;return '';}
function actTrain(){if(Combat.data||!cdReady('train'))return;cds.train=Date.now()+60000;
  const o=[['hp',15,'PV máximos'],['atk',2,'Ataque'],['def',2,'Defensa'],['spd',2,'Velocidad'],['spi',2,'Poder Espiritual']];
  const[k,v,l]=pick(o);state.bonus[k]+=v;log(`🧓 ${MASTERS[state.rank]} te entrena: +${v} ${l} permanente.`,'oro');renderAll();scheduleSave();}
function actAdvice(){log(`🧓 ${MASTERS[state.rank]}: «${pick(ADVICES)}»`,'arcano');
  const g=Math.round((4+totalQi())*getStats().xpMult);addQi(g);log(`La sabiduría nutre tu alma: +${fmt(g)} Qi.`,'good');renderAll();scheduleSave();}
function actMasterQuest(){const q=MASTER_QUESTS[state.master.qi];if(!q||!masterQuestReady(q))return;
  state.master.qi++;
  if(!state.techs[q.rewardTech]){state.techs[q.rewardTech]={lv:1,xp:0};
    log(`🧓 Tu maestro te transmite la técnica <b>${TECH_MAP[q.rewardTech].name}</b>.`,'arcano');}
  else{state.stones.mid+=15;log('🧓 Ya dominabas esa técnica: +15 Piedras Medias.','oro');}
  Scene.burst('#a06ee8');renderAll();scheduleSave();}
function torneoRival(tier,round){return{n:pick(TORNEO_NOMBRES)+' '+pick(TORNEO_EPITETOS),k:'rival',power:totalQi()+tier*3+round*3+rnd(-1,4)};}
function actTorneo(){if(Combat.data)return;if(Date.now()<state.torneo.until)return log('El torneo aún no está preparado.','sistema');
  const t=state.rank,c=8*(t+1);if(state.contrib<c)return log(`La inscripción cuesta ${c} de Contribución.`,'bad');
  state.contrib-=c;state.torneo.until=Date.now()+75000;
  log(`🥁 ¡Comienza el Torneo de ${RANKS[t].name}!`,'oro');Combat.start(torneoRival(t,0),{t:'torneo',tier:t,round:0});renderAll();scheduleSave();}
function torneoVictoria(ctx){const t=ctx.tier;
  if(ctx.round<2){log(`🥋 Ganas el duelo ${ctx.round+1}. ¡El siguiente rival se acerca!`,'good');
    setTimeout(()=>{if(!Combat.data)Combat.start(torneoRival(t,ctx.round+1),{t:'torneo',tier:t,round:ctx.round+1});},900);return;}
  const r=[];const low=120*(t+1);state.stones.low+=low;r.push(`+${low} Bajas`);
  if(t>=1){state.stones.mid+=5*(t+1);r.push(`+${5*(t+1)} Medias`);}
  if(t>=3){state.stones.cel+=1;r.push('+1 Celestial');}
  const c=40*(t+1);state.contrib+=c;r.push(`+${c} Contribución`);state.pills.qi+=2;r.push('+2 Píldoras de Qi');
  const tit=`Campeón de ${RANKS[t].name}`;
  if(!state.titles.includes(tit)){state.titles.push(tit);state.title=tit;log(`👑 Título obtenido: <b>${tit}</b>.`,'titulo');}
  if(t===5&&!state.flags.armaUnica){state.flags.armaUnica=true;state.weapons.owned.push(UNIQUE_WEAPON.id);
    log(`🌌 ¡PREMIO LEGENDARIO! Desciende la <b>${UNIQUE_WEAPON.name}</b>.`,'arcano');}
  log(`🏆 ¡CAMPEÓN DEL TORNEO! ${r.join(', ')}.`,'titulo');}

/* ========== 10. TIENDA Y MERCADO ========== */
function actBuyPill(id){const p=PILLS[id];if(!canPay(p.cost))return log('Piedras insuficientes.','bad');
  pay(p.cost);addRes(id,1);log(`Compras <b>${p.name}</b>.`,'good');renderAll();scheduleSave();}
function actCraft(id){const r=RECIPES[id];if(!Object.entries(r).every(([k,v])=>state.herbs[k]>=v))return log('Hierbas insuficientes.','bad');
  Object.entries(r).forEach(([k,v])=>state.herbs[k]-=v);state.pills[id]++;
  log(`🔥 ¡Fabricas una <b>${PILLS[id].name}</b>!`,'good');renderAll();scheduleSave();}
function actBuyWeapon(id){const w=WEAPON_MAP[id];if(state.weapons.owned.includes(id))return;
  if(state.rank<w.rank)return log(`Requiere rango ${RANKS[w.rank].name}.`,'bad');
  if(!canPay(w.cost))return log('Piedras insuficientes.','bad');pay(w.cost);state.weapons.owned.push(id);
  log(`⚔ Adquieres <b>${w.name}</b> (nivel ${w.grade}).`,'oro');renderAll();scheduleSave();}

function actBuyRobe(id){const r=ROBE_MAP[id];if(state.robes.owned.includes(id))return;

  if(!canPay(r.cost))return log('Piedras insuficientes.','bad');pay(r.cost);state.robes.owned.push(id);
  log(`👘 Compras <b>${r.name}</b>.`,'oro');renderAll();scheduleSave();}
function actEquipRobe(id){if(!state.robes.owned.includes(id))return;state.robes.eq.type=id;syncHp();renderAll();scheduleSave();}
function actBuyColor(id){const c=COLOR_MAP[id];if(state.robes.colors.includes(id))return;

  if(!canPay(c.cost))return log('Piedras insuficientes.','bad');pay(c.cost);state.robes.colors.push(id);
  log(`🎨 Desbloqueas el color <b>${c.name}</b>.`,'good');renderAll();scheduleSave();}
function actSetColor(id){if(!state.robes.colors.includes(id))return;state.robes.eq.color=id;renderAll();scheduleSave();}
function actBuyTech(id){const t=TECH_MAP[id];if(state.techs[id])return;
  if(t.rank&&state.rank<t.rank)return log(`Requiere rango ${RANKS[t.rank].name}.`,'bad');
  if(t.realm&&state.realm<t.realm)return log(`Requiere reino ${REALMS[t.realm].name}.`,'bad');
  if(t.body&&state.cuerpo<t.body)return log(`Requiere Cuerpo ${t.body}.`,'bad');
  if(!canPay(t.cost))return log('Piedras insuficientes.','bad');pay(t.cost);state.techs[id]={lv:1,xp:0};
  log(`📜 Aprendes <b>${t.name}</b>${t.fly?' · ¡Ya puedes volar!':''}.`,'arcano');renderAll();scheduleSave();}
function actUpTech(id){const t=state.techs[id];if(!t||t.lv>=10)return;const d=TECH_MAP[id];
  const val=Math.ceil(d.cost.val*.5*t.lv),cur=Object.keys(d.cost)[0],need=15*t.lv;
  if(t.xp<need)return log(`Necesitas ${need} exp. de uso (tienes ${Math.floor(t.xp)}).`,'sistema');
  if(getRes(cur)<val)return log('Piedras insuficientes.','bad');
  addRes(cur,-val);t.xp-=need;t.lv++;log(`⬆ <b>${d.name}</b> nivel ${t.lv}.`,'good');syncHp();renderAll();scheduleSave();}
function actBuyShip(id){const s=SHIP_MAP[id];if(state.ships.owned.includes(id))return;

function actEquipShip(id){if(!state.ships.owned.includes(id))return;state.ships.eq=state.ships.eq===id?null:id;renderAll();scheduleSave();}
function actPolishShip(id){const b=state.ships.bonus[id]||0;if(b>=5)return log('Forja perfecta ya.','sistema');
  const m=SHIP_POLISH[id];if(state.minerals[m]<10)return log(`Necesitas 10 ${MINERALS[m].name}.`,'bad');
  state.minerals[m]-=10;state.ships.bonus[id]=b+1;log(`🔨 Forja mejorada: +${b+1} velocidad de viaje.`,'good');renderAll();scheduleSave();}
function actExchange(dir,cur){const i=STONES.indexOf(cur);
  if(dir==='up'){if(i>=3||state.stones[cur]<10)return log('Necesitas 10 piedras de este grado.','bad');
    state.stones[cur]-=10;state.stones[STONES[i+1]]++;log(`Cambias 10 ${STONE_UI[cur].n}s por 1 ${STONE_UI[STONES[i+1]].n}.`,'good');}
  else{if(i<=0||state.stones[cur]<1)return;state.stones[cur]--;state.stones[STONES[i-1]]+=10;
    log(`Cambias 1 ${STONE_UI[cur].n} por 10 ${STONE_UI[STONES[i-1]].n}s.`,'good');}
  renderAll();scheduleSave();}
function actSell(k){const m=HERBS[k]||MINERALS[k];if(getRes(k)<1)return;addRes(k,-1);state.stones.low+=m.sell;
  log(`Vendes 1 ${m.name} por ${m.sell} Piedras Bajas.`,'sistema');renderAll();scheduleSave();}
function actSetTitle(t){state.title=state.title===t?null:t;renderAll();scheduleSave();}

/* ========== 11. ESCENA 3D (Three.js) ========== */
const Scene={
  ok:false,lastZone:null,player:null,enemyG:null,zoneG:null,cloudG:null,
  flyFlag:false,celestial:false,robeHex:'#e9e6dc',
  auraUntil:0,travelT:0,hurtT:0,lungeT:-1,enemyKnock:0,
  bursts:[],rings:[],orbiters:[],
  init(){
    if(!window.THREE){$('#no3d').style.display='flex';return;}
    this.ok=true;
    const wrap=$('#scene-wrap');
    this.renderer=new THREE.WebGLRenderer({canvas:$('#scene'),antialias:true});
    this.renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
    this.scene=new THREE.Scene();
    this.camera=new THREE.PerspectiveCamera(60,wrap.clientWidth/wrap.clientHeight,.1,200);
    this.camera.position.set(0,2.4,7.6);
    this.hemi=new THREE.HemisphereLight(0xbfc8ff,0x1a1424,.75);this.scene.add(this.hemi);
    this.moonL=new THREE.DirectionalLight(0xaabbff,.85);this.moonL.position.set(6,10,4);this.scene.add(this.moonL);
    this.auraL=new THREE.PointLight(0x9fe8cb,0,7);this.scene.add(this.auraL);
    // estrellas y luna
    const sp=[];for(let i=0;i<350;i++){const a=Math.random()*Math.PI*2,e=Math.random()*Math.PI*.45,r=80;
      sp.push(Math.cos(a)*Math.cos(e)*r,Math.sin(e)*r+6,Math.sin(a)*Math.cos(e)*r);}
    const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
    this.scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:.35,transparent:true,opacity:.8})));
    this.moon=new THREE.Mesh(new THREE.SphereGeometry(3,20,20),new THREE.MeshBasicMaterial({color:0xf7e6b5}));
    this.moon.position.set(28,26,-60);this.scene.add(this.moon);
    const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex('rgba(247,230,181,.9)'),transparent:true,depthWrite:false}));
    glow.scale.set(22,22,1);glow.position.copy(this.moon.position);this.scene.add(glow);
    // nubes
    this.cloudG=new THREE.Group();
    for(let i=0;i<9;i++){const c=new THREE.Mesh(new THREE.SphereGeometry(3,8,6),
      new THREE.MeshBasicMaterial({color:0xdfe6f5,transparent:true,opacity:.13,depthWrite:false}));
      c.scale.set(2.6,.55,1.4);c.position.set(rnd(-24,24),rnd(3,9),rnd(-30,-6));this.cloudG.add(c);}
    this.scene.add(this.cloudG);
    // suelo base
    this.ground=new THREE.Mesh(new THREE.CircleGeometry(34,40),new THREE.MeshStandardMaterial({color:0x2a2438,roughness:1}));
    this.ground.rotation.x=-Math.PI/2;this.scene.add(this.ground);
    // jugador
    this.player=makeCultivator({robe:0xe9e6dc,accent:0xc85050,sword:true});
    this.player.position.x=-1.15;this.scene.add(this.player);
    this.flySword=makeSwordMesh();this.flySword.rotation.z=Math.PI/2;this.flySword.visible=false;this.scene.add(this.flySword);
    // aura
    this.auraRing=new THREE.Mesh(new THREE.TorusGeometry(.9,.03,8,40),
      new THREE.MeshBasicMaterial({color:0x9fe8cb,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));
    this.auraRing.rotation.x=Math.PI/2;this.scene.add(this.auraRing);
    for(let i=0;i<3;i++){const o=new THREE.Mesh(new THREE.SphereGeometry(.07,8,8),
      new THREE.MeshBasicMaterial({color:0xf4d78a,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));
      this.scene.add(o);this.orbiters.push(o);}
    this.setZone(state.zone,true);
    addEventListener('resize',()=>this.resize());this.resize();
    const loop=()=>{requestAnimationFrame(loop);this.frame();};loop();
  },
  resize(){if(!this.ok)return;const w=$('#scene-wrap');
    this.renderer.setSize(w.clientWidth,w.clientHeight,false);
    this.camera.aspect=w.clientWidth/w.clientHeight;this.camera.updateProjectionMatrix();},
  setZone(id,force){if(!this.ok)return;if(this.lastZone===id&&!force)return;this.lastZone=id;
    const V=ZONE_VIS[id];
    this.scene.background=new THREE.Color(V.bg);
    this.scene.fog=new THREE.FogExp2(V.bg,V.fog);
    this.ground.material.color.set(V.ground);
    this.hemi.color.set(V.sky);this.moonL.color.set(V.light);
    if(this.zoneG){this.scene.remove(this.zoneG);disposeGroup(this.zoneG);}
    this.zoneG=buildZoneProps(id);this.scene.add(this.zoneG);
    $('#scene-poem').textContent=ZONE_MAP[id].poem||'';},
  setFly(f){this.flyFlag=f;},
  setRobe(hex,isCelestial){this.robeHex=hex||'#e9e6dc';this.celestial=!!isCelestial;
    if(this.ok&&this.player)this.player.userData.robeMat.color.set(this.celestial?0xffffff:this.robeHex);},
  setEnemy(spec){if(!this.ok)return;
    if(this.enemyG){this.scene.remove(this.enemyG);disposeGroup(this.enemyG);this.enemyG=null;}
    if(!spec)return;
    this.enemyG=spec.kind==='bestia'?makeBeast(spec.power)
      :makeCultivator({robe:pick([0x2b2733,0x3a2030,0x26303a]),accent:0x8a2a3a,sword:true,headband:false});
    this.enemyG.position.set(1.6,0,0);this.enemyG.rotation.y=-Math.PI/2+.35;this.scene.add(this.enemyG);},
  lunge(){this.lungeT=0;},
  hitEnemy(){if(!this.ok)return;this.enemyKnock=.35;
    if(this.enemyG){this.ringAt(this.enemyG.position,1.2,0xffd76a);this.burstAt(this.enemyG.position,14,0xff9d6a);}},
  hitPlayer(){if(!this.ok)return;this.hurtT=.5;
    this.ringAt(this.player.position,1.1,0xff5a5a);},
  cultivatePulse(){this.auraUntil=performance.now()+2600;},
  burst(color){if(this.ok)this.burstAt(this.player.position,26,new THREE.Color(color).getHex());},
  realmBurst(){if(!this.ok)return;this.burstAt(this.player.position,60,0xf4d78a);
    this.ringAt(this.player.position,2.2,0xf4d78a);this.ringAt(this.player.position,3.4,0xa06ee8);},
  travelDash(){this.travelT=1.1;},
  ringAt(pos,r,color){const m=new THREE.Mesh(new THREE.RingGeometry(r*.7,r*.85,28),
    new THREE.MeshBasicMaterial({color,transparent:true,opacity:.95,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false}));
    m.position.set(pos.x,pos.y+1.2,pos.z);m.lookAt(this.camera.position);
    this.scene.add(m);this.rings.push({m,t:0});},
  burstAt(pos,n,color){const arr=[];const vel=[];
    for(let i=0;i<n;i++){arr.push(pos.x,pos.y+1.1,pos.z);
      vel.push((Math.random()-.5)*.16,Math.random()*.16+.04,(Math.random()-.5)*.16);}
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(arr,3));
    const p=new THREE.Points(g,new THREE.PointsMaterial({color,size:.14,transparent:true,opacity:1,blending:THREE.AdditiveBlending,depthWrite:false}));
    this.scene.add(p);this.bursts.push({p,vel,life:1});},
  floatEnemy(txt,color){this.floatAt(txt,color,this.enemyG?this.enemyG.position:new THREE.Vector3(1.6,0,0));},
  floatPlayer(txt,color){this.floatAt(txt,color,this.player?this.player.position:new THREE.Vector3(-1.1,0,0));},
  floatAt(txt,color,pos){const layer=$('#float-layer');if(!this.ok||!layer)return;
    const v=pos.clone();v.y+=2.1;v.project(this.camera);
    const w=$('#scene-wrap');const x=(v.x*.5+.5)*w.clientWidth,y=(-v.y*.5+.5)*w.clientHeight;
    const s=document.createElement('span');s.className='dmg-float';s.style.left=x+'px';s.style.top=y+'px';
    s.style.color=color;s.textContent=txt;layer.appendChild(s);setTimeout(()=>s.remove(),1000);},
  frame(){if(!this.ok)return;
    const t=performance.now()/1000,dt=.016;
    const flying=this.flyFlag;
    // jugador: respiración, cintas, pelo
    const p=this.player;
    const targetY=flying?3.1+Math.sin(t*1.6)*.25:0;
    p.position.y+=(targetY-p.position.y)*.06;
    p.rotation.y=-Math.PI/2-.3+Math.sin(t*.5)*.06;
    p.userData.ribbons.forEach((r,i)=>{r.rotation.x=.3+Math.sin(t*3+i)*.35;});
    if(p.userData.hairBack)p.userData.hairBack.rotation.x=Math.sin(t*2.2)*.08;
    if(this.celestial)p.userData.robeMat.color.setHSL((t*.08)%1,.65,.68);
    // embestida de ataque
    let lx=0;
    if(this.lungeT>=0){this.lungeT+=dt*2.6;lx=Math.sin(Math.min(this.lungeT,1)*Math.PI)*1.5;
      if(this.lungeT>=1)this.lungeT=-1;}
    p.position.x=-1.15+lx;
    // espada de vuelo
    this.flySword.visible=flying;
    if(flying){this.flySword.position.set(p.position.x,p.position.y-.12,p.position.z);
      this.flySword.rotation.y=t*2;}
    // aura de cultivo
    const aura=performance.now()<this.auraUntil;
    this.auraRing.material.opacity+=((aura?.75:0)-this.auraRing.material.opacity)*.1;
    this.auraRing.position.set(p.position.x,.25,p.position.z);
    this.auraRing.rotation.z=t*1.4;
    this.auraRing.material.color.set(REALMS[state.realm].color);
    this.auraL.position.set(p.position.x,1.6,p.position.z);
    this.auraL.intensity+=((aura?1.6:0)-this.auraL.intensity)*.1;
    this.auraL.color.set(REALMS[state.realm].color);
    this.orbiters.forEach((o,i)=>{const a=t*2+i*2.09;
      o.material.opacity=this.auraRing.material.opacity;
      o.position.set(p.position.x+Math.cos(a)*1.1,1.2+Math.sin(t*3+i)*.3,p.position.z+Math.sin(a)*1.1);});
    // enemigo
    if(this.enemyG){this.enemyKnock=Math.max(0,this.enemyKnock-dt);
      this.enemyG.position.x=1.6+this.enemyKnock*.8;
      this.enemyG.position.y=Math.abs(Math.sin(t*2.4))*.08;
      this.enemyG.rotation.y=-Math.PI/2+.35+Math.sin(t*1.3)*.08;}
    // nubes y viaje
    const cloudY=flying?-2.6:4.6;
    this.cloudG.position.y+=(cloudY-this.cloudG.position.y)*.03;
    this.cloudG.children.forEach(c=>{c.position.x-=dt*(this.travelT>0?26:1.2);
      if(c.position.x<-30)c.position.x=30;});
    if(this.travelT>0)this.travelT-=dt;
    this.camera.fov+=( (this.travelT>0?68:60) - this.camera.fov)*.1;this.camera.updateProjectionMatrix();
    // cámara con temblor
    this.hurtT=Math.max(0,this.hurtT-dt);
    const sh=this.hurtT*.22;
    this.camera.position.x=Math.sin(t*.3)*.5+(Math.random()-.5)*sh;
    this.camera.position.y=2.4+(Math.random()-.5)*sh;
    this.camera.lookAt(.2,1.5+(flying?1.4:0),0);
    // anillos y partículas
    for(let i=this.rings.length-1;i>=0;i--){const r=this.rings[i];r.t+=dt*2.6;
      r.m.scale.setScalar(1+r.t*1.6);r.m.material.opacity=Math.max(0,.95-r.t);
      if(r.t>=1){this.scene.remove(r.m);this.rings.splice(i,1);}}
    for(let i=this.bursts.length-1;i>=0;i--){const b=this.bursts[i];b.life-=dt*.9;
      const pos=b.p.geometry.attributes.position;
      for(let j=0;j<pos.count;j++){pos.setXYZ(j,pos.getX(j)+b.vel[j*3],pos.getY(j)+b.vel[j*3+1],pos.getZ(j)+b.vel[j*3+2]);
        b.vel[j*3+1]-=dt*.12;}
      pos.needsUpdate=true;b.p.material.opacity=Math.max(0,b.life);
      if(b.life<=0){this.scene.remove(b.p);this.bursts.splice(i,1);}}
    // props animados (islas/pabellones)
    if(this.zoneG&&this.zoneG.userData.bob)this.zoneG.userData.bob.forEach((o,i)=>{o.position.y=o.userData.y0+Math.sin(t*.9+i)*.3;});
    this.renderer.render(this.scene,this.camera);}
};
/* ---- constructores 3D ---- */
function glowTex(color){const c=document.createElement('canvas');c.width=c.height=128;
  const g=c.getContext('2d');const rg=g.createRadialGradient(64,64,0,64,64,64);
  rg.addColorStop(0,color);rg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=rg;g.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);}
function disposeGroup(g){g.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose();});}
const GOLD=new THREE.MeshStandardMaterial({color:0xd9a441,metalness:.7,roughness:.3});
function makeSwordMesh(){const g=new THREE.Group();
  const blade=new THREE.Mesh(new THREE.BoxGeometry(.05,1.5,.09),
    new THREE.MeshStandardMaterial({color:0xdfe6f0,metalness:.85,roughness:.2}));
  blade.position.y=.75;g.add(blade);
  const guard=new THREE.Mesh(new THREE.BoxGeometry(.22,.06,.12),GOLD);g.add(guard);
  const hilt=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,.3,6),

  const tassel=new THREE.Mesh(new THREE.ConeGeometry(.04,.2,6),
    new THREE.MeshStandardMaterial({color:0xc8303a}));tassel.position.y=-.38;g.add(tassel);
  return g;}
function makeCultivator(o){const g=new THREE.Group();

  const torso=new THREE.Mesh(new THREE.CylinderGeometry(.15,.17,.5,12),robeMat);torso.position.y=1.62;g.add(torso);
  const lapel=new THREE.Mesh(new THREE.BoxGeometry(.02,.42,.2),accMat);lapel.position.set(.06,1.62,.13);lapel.rotation.z=.2;g.add(lapel);

  g.userData.ribbons=ribs;
  const armGeo=new THREE.CylinderGeometry(.05,.1,.72,8);

  const a2=a1.clone();a2.position.x=-.24;a2.rotation.z=1.05;g.add(a2);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.15,14,12),
    new THREE.MeshStandardMaterial({color:0xe8cba4,roughness:.85}));head.position.y=2.0;g.add(head);
  const hair=new THREE.Mesh(new THREE.SphereGeometry(.16,14,12,0,Math.PI*2,0,Math.PI*.62),hairMat);hair.position.y=2.02;g.add(hair);
  const bun=new THREE.Mesh(new THREE.SphereGeometry(.07,10,8),hairMat);bun.position.y=2.22;g.add(bun);
  const pin=new THREE.Mesh(new THREE.CylinderGeometry(.01,.01,.26,6),GOLD);pin.rotation.z=Math.PI/2;pin.position.y=2.22;g.add(pin);
  const back=new THREE.Mesh(new THREE.PlaneGeometry(.2,1.1),hairMat);back.position.set(0,1.45,-.17);g.add(back);
  g.userData.hairBack=back;
  if(o.headband){const hb=new THREE.Mesh(new THREE.TorusGeometry(.155,.018,6,16),
    new THREE.MeshBasicMaterial({color:0xf5f5f5}));hb.rotation.x=Math.PI/2;hb.position.y=2.05;g.add(hb);}
  if(o.sword){const s=makeSwordMesh();s.rotation.set(0,.5,.55);s.position.set(.14,1.45,-.24);g.add(s);}
  if(o.flute){const f=new THREE.Mesh(new THREE.CylinderGeometry(.022,.022,.75,6),
    new THREE.MeshStandardMaterial({color:0x2a1a12}));f.rotation.z=Math.PI/2;f.position.set(0,1.66,.3);g.add(f);
    a1.rotation.set(1.25,0,-1.35);a2.rotation.set(1.25,0,1.35);a1.position.set(.2,1.62,.26);a2.position.set(-.2,1.62,.26);}

function makeBeast(power){const g=new THREE.Group();
  g.scale.setScalar(clamp(.8+power*.02,.8,1.8));
  const mat=new THREE.MeshStandardMaterial({color:0x2c1a26,roughness:.85});
  const body=new THREE.Mesh(new THREE.BoxGeometry(1.15,.62,.52),mat);body.position.y=.62;g.add(body);
  const head=new THREE.Mesh(new THREE.BoxGeometry(.46,.4,.42),mat);head.position.set(-.72,.78,0);g.add(head);
  const snout=new THREE.Mesh(new THREE.BoxGeometry(.24,.18,.2),mat);snout.position.set(-1.0,.7,0);g.add(snout);
  const earG=new THREE.ConeGeometry(.09,.32,4);
  [.13,-.13].forEach(z=>{const e=new THREE.Mesh(earG,mat);e.position.set(-.76,1.05,z);g.add(e);});
  const eyeM=new THREE.MeshBasicMaterial({color:0xff4444});
  [.12,-.12].forEach(z=>{const e=new THREE.Mesh(new THREE.SphereGeometry(.05,6,6),eyeM);e.position.set(-.94,.84,z);g.add(e);});
  const legG=new THREE.BoxGeometry(.15,.52,.15);
  [[-.42,.26,.2],[-.42,.26,-.2],[.42,.26,.2],[.42,.26,-.2]].forEach(p=>{const l=new THREE.Mesh(legG,mat);l.position.set(...p);g.add(l);});
  const tail=new THREE.Mesh(new THREE.ConeGeometry(.09,.65,6),mat);tail.rotation.z=-1.2;tail.position.set(.75,.8,0);g.add(tail);
  const spikeM=new THREE.MeshStandardMaterial({color:0x552233});
  for(let i=0;i<4;i++){const s=new THREE.Mesh(new THREE.ConeGeometry(.07,.28,4),spikeM);s.position.set(-.32+i*.26,1.0,0);g.add(s);}
  return g;}

function buildZoneProps(id){const g=new THREE.Group();g.userData.bob=[];
  const add=m=>{g.add(m);return m;};
  const cone=(r,h,c,x,z,flat)=>{const m=new THREE.Mesh(new THREE.ConeGeometry(r,h,7),
    new THREE.MeshStandardMaterial({color:c,flatShading:true,roughness:1}));m.position.set(x,h/2-.2,z);if(flat)m.scale.z=.6;return add(m);};
  if(id==='secta'){
    const pil=(x)=>{const p=new THREE.Mesh(new THREE.BoxGeometry(.22,3.4,.22),
      new THREE.MeshStandardMaterial({color:0x6a2030}));p.position.set(x,1.7,-3);return add(p);};
    pil(-1.6);pil(1.6);
    const beam=new THREE.Mesh(new THREE.BoxGeometry(4.4,.25,.3),
      new THREE.MeshStandardMaterial({color:0x2a1a20}));beam.position.set(0,3.3,-3);add(beam);
    const roof=new THREE.Mesh(new THREE.BoxGeometry(5,.18,.7),GOLD);roof.position.set(0,3.62,-3);roof.rotation.z=.04;add(roof);
    // compañeros estilo The Untamed: espada blanca y flauta negra
    const lan=makeCultivator({robe:0xf2f0ea,accent:0xdfe6f0,sword:true,headband:true});
    lan.position.set(3.1,0,-1.6);lan.rotation.y=-1.2;add(lan);
    const wei=makeCultivator({robe:0x201c26,accent:0xc8303a,flute:true});
    wei.position.set(2.3,0,-.4);wei.rotation.y=-1.9;add(wei);
    for(let i=0;i<5;i++)cone(rnd(2,4),rnd(4,7),0x1e3326,rnd(-16,16),rnd(-18,-6),true);
    for(let i=0;i<4;i++){const l=new THREE.Mesh(new THREE.SphereGeometry(.12,8,8),
      new THREE.MeshBasicMaterial({color:0xffb060}));l.position.set(rnd(-4,4),2.2,rnd(-2,2));add(l);}
  }
  if(id==='bosque')for(let i=0;i<30;i++){const b=new THREE.Mesh(new THREE.CylinderGeometry(.06,.08,rnd(4,6),6),
    new THREE.MeshStandardMaterial({color:0x3f7a4f}));const a=Math.random()*6.28,r=rnd(4,16);
    b.position.set(Math.cos(a)*r,2.6,Math.sin(a)*r-4);b.rotation.z=(Math.random()-.5)*.15;add(b);}
  if(id==='valle')for(let i=0;i<14;i++){const r=new THREE.Mesh(new THREE.DodecahedronGeometry(rnd(1,2.4),0),
    new THREE.MeshStandardMaterial({color:0x3a3050,flatShading:true}));const a=Math.random()*6.28,d=rnd(5,16);
    r.position.set(Math.cos(a)*d,rnd(.4,1.4),Math.sin(a)*d-4);add(r);}
  if(id==='islas'||id==='vacio')for(let i=0;i<6;i++){const isl=new THREE.Group();
    const top=new THREE.Mesh(new THREE.CylinderGeometry(rnd(1.6,3),rnd(1.2,2.2),.7,8),
      new THREE.MeshStandardMaterial({color:id==='vacio'?0x1a1428:0x2f5b45,flatShading:true}));
    const rock=new THREE.Mesh(new THREE.ConeGeometry(2,rnd(2,4),7),
      new THREE.MeshStandardMaterial({color:0x241a30,flatShading:true}));rock.rotation.x=Math.PI;rock.position.y=-1.6;
    isl.add(top,rock);const a=Math.random()*6.28,d=rnd(7,18);
    isl.position.set(Math.cos(a)*d,rnd(2,7),Math.sin(a)*d-6);isl.userData.y0=isl.position.y;g.userData.bob.push(isl);add(isl);}
  if(id==='montana')for(let i=0;i<7;i++){const m=cone(rnd(3,6),rnd(8,14),0x4a4460,rnd(-20,20),rnd(-26,-8),true);
    const s=new THREE.Mesh(new THREE.ConeGeometry(m.geometry.parameters.radius*.45,3,7),
      new THREE.MeshStandardMaterial({color:0xe8ecf5,flatShading:true}));s.position.set(m.position.x,m.position.y+m.geometry.parameters.height/2-.6,m.position.z);add(s);}
  if(id==='continente')for(let i=0;i<10;i++){const c=new THREE.Mesh(new THREE.CylinderGeometry(.4,.5,rnd(2,5),8),
    new THREE.MeshStandardMaterial({color:0x6a5a4a,roughness:1}));const a=Math.random()*6.28,d=rnd(5,15);
    c.position.set(Math.cos(a)*d,c.geometry.parameters.height/2-.3,Math.sin(a)*d-4);
    c.rotation.z=(Math.random()-.5)*.3;add(c);}
  if(id==='palacio'){for(let i=0;i<8;i++){const a=i/8*6.28,d=9;
    const c=new THREE.Mesh(new THREE.CylinderGeometry(.3,.35,6,10),GOLD);
    c.position.set(Math.cos(a)*d,2.7,Math.sin(a)*d-4);add(c);}
    const ring=new THREE.Mesh(new THREE.TorusGeometry(5,.12,8,40),
      new THREE.MeshBasicMaterial({color:0xf4d78a,transparent:true,opacity:.5}));
    ring.position.set(0,5,-6);ring.rotation.x=1.2;ring.userData.y0=5;g.userData.bob.push(ring);add(ring);}
  if(id==='vacio')for(let i=0;i<5;i++){const r=new THREE.Mesh(new THREE.PlaneGeometry(rnd(2,4),rnd(4,8)),
    new THREE.MeshBasicMaterial({color:0x8040d0,transparent:true,opacity:.35,side:THREE.DoubleSide,blending:THREE.AdditiveBlending}));
    const a=Math.random()*6.28,d=rnd(8,18);r.position.set(Math.cos(a)*d,rnd(2,6),Math.sin(a)*d-6);
    r.rotation.set(Math.random(),Math.random()*3,Math.random());add(r);}
  return g;}

    return `<div class="card ${ow?'owned':''} ${ok?'':'locked'}"><div class="c-name">${t.name} ${ow?`<span style="color:var(--jade-soft)">Nv ${ow.lv}/10</span>`:''}</div>
      <div class="c-sub">${t.desc}</div>
      ${ow?`<div class="mini">Exp. uso: ${Math.floor(ow.xp)}/${need} · Mejorar: ${up} ${STONE_UI[cur].n}s</div>
        <button class="btn jade sm mt" data-act="up_tech" data-id="${t.id}" ${ow.lv<10&&ow.xp>=need&&getRes(cur)>=up?'':'disabled'}>${ow.lv>=10?'Maestría':'Mejorar'}</button>`
        :`<div class="c-cost">${costTxt(t.cost)}</div>${!ok?'<div class="req-no">Requisitos pendientes</div>':''}
        <button class="btn sm" data-act="buy_tech" data-id="${t.id}" ${ok&&canPay(t.cost)?'':'disabled'}>Aprender</button>`}</div>`;}).join('')}</div>`).join('');}
function shopBarcos(){return `<div class="cards">${SHIPS.map(s=>{const ow=state.ships.owned.includes(s.id),b=state.ships.bonus[s.id]||0,m=SHIP_POLISH[s.id];
  return `<div class="card ${ow?'owned':''}"><div class="c-name">${s.name}</div>
    <div class="c-sub">Cap. ${s.cap} · Vel ${s.spd}${b?` +${b} ❖`:''}${s.id==='celestial'?' · Cruza continentes':''}${s.id==='divino'?' · Entre mundos':''}</div>
    <div class="c-cost">${costTxt(s.cost)}</div>
    ${ow?`<div class="row"><button class="btn jade sm" data-act="equip_ship" data-id="${s.id}">${state.ships.eq===s.id?'✔ Equipado':'Equipar'}</button>
      <button class="btn sm" data-act="polish_ship" data-id="${s.id}" ${b<5&&state.minerals[m]>=10?'':'disabled'}>Forjar ❖${b}/5</button></div>`
      :`<button class="btn sm" data-act="buy_ship" data-id="${s.id}" ${canPay(s.cost)?'':'disabled'}>Construir</button>`}</div>`;}).join('')}</div>`;}
function shopMercado(){const ex=STONES.map((k,i)=>{const p=STONES[i-1],n=STONES[i+1];
  return `<div class="list-line"><span style="color:${STONE_UI[k].c}">● ${STONE_UI[k].n} (${fmt(state.stones[k])})</span><span class="row">
    ${p?`<button class="btn sm" data-act="exchange" data-dir="down" data-cur="${k}" ${state.stones[k]>=1?'':'disabled'}>1→10 ${STONE_UI[p].n}s</button>`:''}
    ${n?`<button class="btn sm" data-act="exchange" data-dir="up" data-cur="${k}" ${state.stones[k]>=10?'':'disabled'}>10→1 ${STONE_UI[n].n}</button>`:''}</span></div>`;}).join('');
  const sh=Object.entries(HERBS).map(([k,h])=>`<div class="list-line"><span>🌿 ${h.name} ×${state.herbs[k]}</span>
    <button class="btn sm" data-act="sell" data-id="${k}" ${state.herbs[k]>=1?'':'disabled'}>Vender (+${h.sell})</button></div>`).join('');
  const sm=Object.entries(MINERALS).map(([k,m])=>`<div class="list-line"><span>⛏ ${m.name} ×${state.minerals[k]}</span>
    <button class="btn sm" data-act="sell" data-id="${k}" ${state.minerals[k]>=1?'':'disabled'}>Vender (+${m.sell})</button></div>`).join('');
  return `<h3>Casa de cambio</h3>${ex}<h3>Vender hierbas</h3>${sh}<h3>Vender minerales</h3>${sm}`;}
function renderAlquimia(){return `<h2><span class="zg">丹</span>Horno de Alquimia</h2>
  <p class="note mb">Las hierbas raras solo crecen en zonas de vuelo o ultramar.</p>
  <div class="cards">${Object.entries(RECIPES).map(([p,r])=>`<div class="card"><div class="c-name">${PILLS[p].name}</div>
    <div class="c-sub">${Object.entries(r).map(([h,n])=>`<span class="${state.herbs[h]>=n?'req-ok':'req-no'}">${HERBS[h].name} ${state.herbs[h]}/${n}</span>`).join('<br>')}</div>
    <button class="btn jade sm" data-act="craft" data-id="${p}" ${Object.entries(r).every(([h,n])=>state.herbs[h]>=n)?'':'disabled'}>Refinar</button></div>`).join('')}</div>`;}
function renderMisiones(){const act=state.missions.active.map(m=>{const d=MISSION_BY_PID[m.pid];
  return `<div class="card mb"><div class="c-name">${d.name}</div>
    <div class="c-sub">Progreso ${Math.min(m.prog,d.goal.n)}/${d.goal.n} · Recompensa: ${costTxt(d.reward)}</div>
    ${bar(m.prog/d.goal.n*100,'qi')}<button class="btn danger sm mt" data-act="mission_drop" data-id="${m.pid}">Abandonar</button></div>`;}).join('')||'<p class="note">Sin misiones activas.</p>';
  const off=state.missions.offer?(()=>{const d=MISSION_BY_PID[state.missions.offer];
    return `<div class="card mb" style="border-color:var(--gold)"><div class="c-name">${d.name}</div>
      <div class="c-sub">Recompensa: ${costTxt(d.reward)}</div><button class="btn jade" data-act="mission_take">Aceptar</button></div>`;})():'';
  return `<h2><span class="zg">任</span>Tablón de Misiones</h2>
    <div class="row mb"><button class="btn" data-act="mission_new" ${state.missions.offer||state.missions.active.length>=3?'disabled':''}>📜 Buscar misión (${state.missions.active.length}/3)</button>
    <span class="mini">Cumplidas: <em>${state.misiones}</em></span></div>${off}${act}`;}
function renderMaestro(){const q=MASTER_QUESTS[state.master.qi];
  const qb=q?`<div class="card mb"><div class="c-name">Misión personal: ${q.name}</div><div class="c-sub">${q.desc}</div>
    <div class="mini">Progreso: ${masterQuestProgress(q)} · Premio: <b>${TECH_MAP[q.rewardTech].name}</b></div>
    <button class="btn violet mt" data-act="master_quest" ${masterQuestReady(q)?'':'disabled'}>Completar enseñanza</button></div>`
    :'<p class="note">Has completado todas sus enseñanzas.</p>';
  return `<h2><span class="zg">师</span>Maestro</h2>
    <div class="card mb"><div class="c-name" style="font-size:16px">🧓 ${MASTERS[state.rank]}</div>
    <div class="c-sub">Al ascender de rango, un maestro más poderoso te toma como discípulo.</div></div>
    <div class="row mb"><button class="btn jade" data-act="train" ${cdReady('train')?'':'disabled'}>🥋 Entrenar <span data-cd="train">${cdReady('train')?'':Math.ceil((cds.train-Date.now())/1000)+'s'}</span></button>
    <button class="btn violet" data-act="advice">🍵 Consejo</button></div>${qb}`;}
function renderViaje(){return `<h2><span class="zg">游</span>Mapa del Mundo</h2>
  <p class="note mb">Las zonas elevadas exigen <em>volar</em>; las lejanas, <em>barcos</em> mayores.</p>
  <div class="cards">${ZONES.map(z=>{const err=canEnterZone(z),here=z.id===state.zone;
    const reqs=[z.reqFly&&'Vuelo',z.reqRealm&&`Reino ${REALMS[z.reqRealm].name}`,z.reqShip&&SHIP_MAP[z.reqShip].name].filter(Boolean);
    return `<div class="card ${here?'owned':''}"><div class="c-name">${z.glyph} ${z.name} ${here?'<span style="color:var(--jade-soft)">· Aquí</span>':''}</div>
      <div class="c-sub">${z.desc}</div>${z.safe?'<div class="req-ok">Zona segura</div>':`<div class="mini">Peligro: nivel ${z.power}</div>`}
      ${reqs.length?`<div class="${err?'req-no':'req-ok'}">${err?'✘':'✔'} ${reqs.join(' · ')}</div>`:''}
      ${!here?`<button class="btn sm mt" data-act="travel" data-id="${z.id}" ${err?'disabled':''}>Viajar</button>`:''}</div>`;}).join('')}</div>`;}
function renderTorneo(){const t=state.rank,rest=Math.max(0,Math.ceil((state.torneo.until-Date.now())/1000));
  return `<h2><span class="zg">武</span>Gran Torneo</h2>
    <div class="card mb"><div class="c-name">Torneo de ${RANKS[t].name}</div>
    <div class="c-sub">Tres duelos. Inscripción: <b>${8*(t+1)} Contribución</b>. En el torneo del Patriarca aguarda un <b>arma divina única</b>.</div>
    <button class="btn violet big" data-act="torneo" ${rest||Combat.data?'disabled':''}>${rest?`El gong suena en ${rest}s`:'🥁 ¡Inscribirse!'}</button></div>
    <h3>Torneos por rango</h3>${RANKS.map((r,i)=>`<div class="list-line ${i===t?'cur':''}"><span>${i===t?'◆':'◇'} Torneo de ${r.name}</span><span class="mini">${i===t?'Disponible':'Asciende para participar'}</span></div>`).join('')}`;}
function renderCounters(){$('#counters').innerHTML=`
  <div>Cultivos <b>${fmt(state.stats.cultivar)}</b></div><div>Recolecciones <b>${fmt(state.stats.gather)}</b></div>
  <div>Bestias <b>${fmt(state.stats.beasts)}</b></div><div>Rivales <b>${fmt(state.stats.rivals)}</b></div>
  <div>Misiones <b>${state.misiones}</b></div><div>Títulos <b>${state.titles.length}</b></div>`;}
function renderAll(){syncHp();
  const S=getStats();
  Scene.setFly(S.canFly&&state.flying);
  Scene.setRobe(robeHex(),state.robes.eq.color==='celestial');
  Scene.setZone(state.zone);
  renderHeaderZone();renderChar();renderEquip();renderRes();renderActionBar();renderTabPanel();renderCounters();}

/* ========== 13. EVENTOS Y ARRANQUE ========== */
const Actions={cultivate:actCultivar,hunt:actHunt,gather:actGather,heal:actHeal,fly:actFly,
  breakthrough:actBreakthrough,pill:el=>usePill(el.dataset.id),
  tab:el=>{uiState.tab=el.dataset.id;renderAll();},stab:el=>{uiState.shop=el.dataset.id;renderAll();},
  buy_pill:el=>actBuyPill(el.dataset.id),craft:el=>actCraft(el.dataset.id),
  buy_weapon:el=>actBuyWeapon(el.dataset.id),equip_weapon:el=>actEquipWeapon(el.dataset.id),
  buy_robe:el=>actBuyRobe(el.dataset.id),equip_robe:el=>actEquipRobe(el.dataset.id),
  buy_color:el=>actBuyColor(el.dataset.id),set_color:el=>actSetColor(el.dataset.id),
  buy_tech:el=>actBuyTech(el.dataset.id),up_tech:el=>actUpTech(el.dataset.id),
  buy_ship:el=>actBuyShip(el.dataset.id),equip_ship:el=>actEquipShip(el.dataset.id),polish_ship:el=>actPolishShip(el.dataset.id),
  exchange:el=>actExchange(el.dataset.dir,el.dataset.cur),sell:el=>actSell(el.dataset.id),
  serve:actServe,promote:actPromote,mission_new:actMissionNew,mission_take:actMissionTake,mission_drop:el=>actMissionDrop(el.dataset.id),
  travel:el=>actTravel(el.dataset.id),torneo:actTorneo,train:actTrain,advice:actAdvice,master_quest:actMasterQuest,
  set_title:el=>actSetTitle(el.dataset.id),
  c_attack:()=>Combat.attack(),c_tech:el=>Combat.useTech(el.dataset.id),c_heal:()=>Combat.useHeal(),
  c_speed:()=>Combat.useSpeed(),c_flee:()=>Combat.flee(),c_close:()=>Combat.close(),reset:hardReset};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const fn=Actions[el.dataset.act];if(fn)fn(el);});
function tick(){$$('[data-cd]').forEach(el=>{const k=el.dataset.cd;
    el.textContent=cds[k]&&Date.now()<cds[k]?Math.ceil((cds[k]-Date.now())/1000)+'s':'';});
  renderActionBar();
  if(['torneo','maestro','secta'].includes(uiState.tab))renderTabPanel();}
function boot(){load();syncHp();Scene.init();renderAll();
  log('🏮 Bienvenido a la <b>Secta de la Nube Verde</b>. Cultiva, templa tu cuerpo y asciende a la inmortalidad.','oro');
  if(state.zone==='secta')log('🎐 Bajo el pabellón, un cultivador de blanco ensaya con la espada mientras su compañero de negro toca una flauta de bambú.','arcano');
  log('💡 Consejo: cultiva hasta nv. 9, caza en el Bosque de Bambú y visita a tu maestro (pestaña 师).','sistema');
  setInterval(tick,500);setInterval(save,8000);addEventListener('beforeunload',save);}
boot();
</script>
</body>
